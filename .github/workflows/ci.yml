name: ci

# Corre en cada Pull Request hacia main y en cada push a main (así se demuestra que main pasa).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Solo lectura: en PR desde un fork el token no puede escribir, por eso el resumen va a GITHUB_STEP_SUMMARY.
permissions:
  contents: read

jobs:
  # 1. Reglas de estructura y de arquitectura
  reglas:
    name: Reglas de estructura y arquitectura
    runs-on: ubuntu-latest
    steps:
      # Descarga el código del repositorio en la máquina de GitHub
      - uses: actions/checkout@v4
      # Script del docente: archivos obligatorios, sin .env, sin requests
      - name: Verificador del docente
        run: bash scripts/verificar_estructura.sh
      # Falla si alguna capa app/servicios/ importa FastAPI o Starlette
      - name: La capa de servicio no importa FastAPI
        run: |
          if grep -rnE '^\s*(from|import)\s+(fastapi|starlette)' servicios/*/app/servicios/ 2>/dev/null; then
            echo "::error::Una capa de servicio importa FastAPI"; exit 1
          fi
          echo "OK: ninguna capa de servicio importa FastAPI"

  # 2. Descubre qué servicios existen hoy (la matriz crece sola cuando llega uno nuevo)
  descubrir:
    name: Descubrir servicios
    runs-on: ubuntu-latest
    # Salida del job: la lista de servicios en JSON, p. ej. ["ms-confiabilidad","ms-pagos"]
    outputs:
      servicios: ${{ steps.lista.outputs.servicios }}
    steps:
      - uses: actions/checkout@v4
      # Busca carpetas servicios/*/ con pyproject.toml y las convierte en lista JSON con jq
      - id: lista
        name: Listar servicios con pyproject.toml
        run: |
          lista=$(for d in servicios/*/; do [ -f "${d}pyproject.toml" ] && basename "$d"; done | jq -R . | jq -sc .)
          echo "servicios=$lista" >> "$GITHUB_OUTPUT"
          echo "Servicios encontrados: $lista"

  # 3. Matriz: un trabajo por servicio con pytest y cobertura mínima
  pruebas-servicio:
    name: pytest y cobertura · ${{ matrix.servicio }}
    needs: descubrir
    # Si todavía no hay servicios, este job no corre (una matriz vacía daría error)
    if: needs.descubrir.outputs.servicios != '[]'
    runs-on: ubuntu-latest
    # fail-fast: false → si un servicio falla, los demás terminan igual
    strategy:
      fail-fast: false
      matrix:
        servicio: ${{ fromJSON(needs.descubrir.outputs.servicios) }}
    # Todos los comandos se ejecutan dentro de la carpeta del servicio
    defaults:
      run:
        working-directory: servicios/${{ matrix.servicio }}
    steps:
      - uses: actions/checkout@v4
      # Instala uv (igual que el workflow del docente)
      - name: Instalar uv
        run: python3 -m pip install --user uv && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Crea el entorno con las versiones exactas de uv.lock
      - name: Instalar dependencias
        run: uv sync
      # Corre las pruebas midiendo cobertura de app/; falla si queda por debajo del 70 %
      - name: Pruebas con cobertura (umbral 70 %, ver tests/README.md)
        run: uv run --with pytest-cov pytest -q --cov=app --cov-report=term --cov-fail-under=70
      # Publica la tabla de cobertura en la pestaña Summary (incluso si las pruebas fallaron)
      - name: Publicar resumen de cobertura
        if: always()
        run: |
          echo "### Cobertura de ${{ matrix.servicio }}" >> "$GITHUB_STEP_SUMMARY"
          uv run --with coverage coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY" || echo "Sin datos de cobertura" >> "$GITHUB_STEP_SUMMARY"

  # 4. Pruebas transversales del grupo (contrato, aceptación con simuladores y resiliencia)
  pruebas-transversales:
    name: Contrato, aceptación y resiliencia
    runs-on: ubuntu-latest
    # Todos los comandos se ejecutan dentro de tests/
    defaults:
      run:
        working-directory: tests
    steps:
      - uses: actions/checkout@v4
      # Instala uv
      - name: Instalar uv
        run: python3 -m pip install --user uv && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Crea el entorno del proyecto de pruebas
      - name: Instalar dependencias
        run: uv sync
      # Corre contrato, aceptación y resiliencia (lo que necesita servicios reales se salta)
      - name: Ejecutar pytest
        run: uv run pytest -v
